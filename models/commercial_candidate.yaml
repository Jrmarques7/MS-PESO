  breed: target_population_to_be_confirmed

limitations:
  - Pacote interno; não usar em produção ou exploração comercial.
  - O gate técnico não confirma bovino, raça, pose, corpo inteiro ou domínio.
  - O intervalo depende da representatividade dos animais de calibração.
  - Não usar como única fonte para venda, dosagem ou decisões críticas.

