schema_version: 1
policy_id: controlled-rgb-capture
policy_version: "1"

analysis:
  max_dimension: 512

thresholds:
  min_width: 480
  min_height: 320
  min_aspect_ratio: 1.15
  max_aspect_ratio: 2.00
  min_mean_luma: 35.0
  max_mean_luma: 220.0
  max_dark_fraction: 0.80
  max_bright_fraction: 0.80
  min_sharpness: 100.0

limitations:
  - Não confirma a presença nem a quantidade de bovinos.
  - Não valida raça, vista lateral, corpo inteiro, oclusão ou distância da câmera.
  - Os limites são heurísticos e precisam de calibração com a coleta de Nelore.
