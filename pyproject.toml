[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ms-peso"
version = "0.1.0"
description = "Estimativa de peso vivo de bovinos por visão computacional"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<2.3",
  "openpyxl>=3.1,<4",
  "Pillow>=10,<12",
  "PyYAML>=6,<7",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
]

[project.optional-dependencies]
service = [
  "fastapi>=0.115,<1",
  "opencv-python-headless>=4.10,<5",
  "python-multipart>=0.0.18,<1",
  "uvicorn>=0.30,<1",
]
dev = [
  "fastapi>=0.115,<1",
  "httpx2>=2,<3",
  "opencv-python-headless>=4.10,<5",
  "python-multipart>=0.0.18,<1",
  "pytest>=7.4,<9",
  "ruff>=0.6,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
ms-peso-service = "ms_peso.service.run:main"
ms-peso-predict-video = "ms_peso.predict_video:main"
ms-peso-validate-uav-capture = "ms_peso.validate_uav_capture:main"
ms-peso-init-collection-batch = "ms_peso.init_collection_batch:main"
ms-peso-select-collection-frames = "ms_peso.select_collection_frames:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
